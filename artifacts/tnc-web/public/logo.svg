<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="200" height="200" rx="44" fill="url(#bg)"/>
  <!-- Subtle inner glow -->
  <rect x="6" y="6" width="188" height="188" rx="40" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  <!-- Medical cross -->
  <rect x="86" y="18" width="28" height="76" rx="8" fill="url(#crossGrad)" opacity="0.95"/>
  <rect x="58" y="40" width="84" height="28" rx="8" fill="url(#crossGrad)" opacity="0.95"/>
  <!-- Red heart center -->
  <path d="M100 96 C95 90 83 90 83 101 C83 111 100 120 100 120 C100 120 117 111 117 101 C117 90 105 90 100 96Z" fill="#ef4444"/>
  <!-- TNC text -->
  <text x="100" y="156" text-anchor="middle" font-family="'Arial Black', 'Arial Bold', Arial, sans-serif" font-size="46" font-weight="900" fill="white" letter-spacing="-2">TNC</text>
  <!-- Nursing text -->
  <text x="100" y="177" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="rgba(255,255,255,0.75)" letter-spacing="4">NURSING</text>
</svg>
